        vehicle:
          type: object
          properties:
            make: { type: string }
            model: { type: string }
            color: { type: string }
            plate: { type: string }
        location:
          type: object
          nullable: true
          properties:
            lat: { type: number }
            lng: { type: number }
            heading: { type: number, nullable: true }
            captured_at: { type: string, format: date-time }
            stale: { type: boolean }
    RiderSnapshot:
      type: object

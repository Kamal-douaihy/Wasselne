        contact_window_closes_at: { type: string, format: date-time, nullable: true }
        requested_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time, nullable: true }
        arrived_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        end_reason: { type: string, nullable: true }
        server_now: { type: string, format: date-time }
    RideListItem:
      type: object
      required: [id, status, requested_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RideStatus' }
        category_name: { $ref: '#/components/schemas/LocalizedText' }

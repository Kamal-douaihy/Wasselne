        fare: { $ref: '#/components/schemas/Fare' }
        payment_status:
          type: string
          enum: [NOT_DUE, DUE, CHARGE_PENDING, CHARGE_FAILED, RECORDED, DISPUTED, RESOLVED, VOID]

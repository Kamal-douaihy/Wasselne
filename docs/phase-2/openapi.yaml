openapi: 3.1.0
info:
  title: Wasselne Platform API
  version: 0.1.0
  summary: Design contract for the Wasselne rider/driver/admin API. Not an implementation.
  description: |
    Companion to `02_State_Machines_and_Transactions.md` and `schema.sql` (docs/phase-2). Money is always
    integer minor units + ISO currency code (USD, LBP). Rates/percentages are integer basis points
    (10000 = 100%). All timestamps are RFC 3339 UTC. Every mutation that could duplicate requires an
    `Idempotency-Key` header. Every response carries `X-Correlation-Id`. No example in this document is a
    real fare, phone number, legal text, or emergency number — all examples are synthetic placeholders.
servers:
  - url: https://api.wasselne.example/v1
    description: Design-time placeholder host.

security:
  - riderDriverBearer: []

tags:
  - name: Auth
    description: OTP sign-in, tokens, logout (rider + driver apps).
  - name: Me
    description: Own profile, language, currency, account deletion.
  - name: Legal
    description: Legal documents and acceptance.
  - name: Push
    description: Push notification device registration.
  - name: Uploads
    description: Presigned upload grants for private storage.
  - name: Config
    description: App bootstrap configuration.
  - name: Rider Coverage
    description: Service area and nearby vehicles.
  - name: Rider Places
    description: Saved places CRUD.
  - name: Rider Quotes
    description: Fare quotes and promo validation.
  - name: Rider Rides
    description: Requesting, tracking, cancelling, paying for rides.
  - name: Rider Chat
    description: In-ride chat (rider side).
  - name: Rider Reviews
    description: Post-trip rating.
  - name: Rider Support
    description: Support cases (rider side).
  - name: Rider SOS
    description: Safety incidents (rider side).
  - name: Driver Onboarding
    description: Driver profile, vehicle, categories, documents, submission.
  - name: Driver State
    description: Recovery snapshot, online/offline, location.
  - name: Driver Offers
    description: The 3-second ACK/accept/decline flow.
  - name: Driver Rides
    description: Trip transitions and payment recording (driver side).
  - name: Driver Wallet
    description: Balances, ledger, payout info.
  - name: Driver Vehicle Checks
    description: Monthly vehicle check submissions.
  - name: Driver Documents
    description: Driver document status.
  - name: Driver Earnings
    description: Earnings summaries.
  - name: Driver Chat
    description: In-ride chat (driver side).
  - name: Driver Support
    description: Support cases (driver side).
  - name: Driver SOS
    description: Safety incidents (driver side).
  - name: Admin Auth
    description: Admin sign-in and MFA.
  - name: Admin Dashboard
    description: Live operational counts.
  - name: Admin Live Map
    description: Driver and ride map feed snapshot.
  - name: Admin Rides
    description: Ride oversight and chat audit.
  - name: Admin People
    description: Riders and drivers.
  - name: Admin Driver Approvals
    description: Document review queue.
  - name: Admin Vehicle Checks
    description: Monthly check review.
  - name: Admin Catalog
    description: Categories, document types, zones.
  - name: Admin Pricing
    description: Tariffs, surge, add-ons, discounts, commission.
  - name: Admin Platform Settings
    description: Versioned CMS platform parameters.
  - name: Admin Payments
    description: Payment methods, settlement methods, wallets, payouts, settlements.
  - name: Admin SOS
    description: SOS configuration, incident queue, agent shift presence.
  - name: Admin Support
    description: Support case management.
  - name: Admin Reviews
    description: Review moderation.
  - name: Admin Legal
    description: Legal document publication.
  - name: Admin Users
    description: Admin accounts, roles, audit log.

paths:
  /auth/otp/request:
    post:
      operationId: authOtpRequest
      tags: [Auth]
      summary: "Request an SMS OTP code for sign-in or sign-up."
      security: []
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/OtpRequestBody' } } } }
      responses:
        '200': { description: "Challenge created.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/OtpRequestResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/otp/verify:
    post:
      operationId: authOtpVerify
      tags: [Auth]
      summary: "Verify the OTP code. Returns a session for a known account, or a needs-profile token for a new one."
      security: []
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/OtpVerifyBody' } } } }
      responses:
        '200': { description: "OTP_INVALID / OTP_EXPIRED / OTP_RATE_LIMITED are returned as errors, not as a 200 with a flag.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/OtpVerifyResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/complete-profile:
    post:
      operationId: meCompleteProfile
      tags: [Auth, Me]
      summary: "Create the profile for a new rider or driver. Bearer is the needs_profile_token from otp/verify."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CompleteProfileBody' } } } }
      responses:
        '201': { description: "Account created; session issued.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SessionTokens' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }  # A-3-03: global per-IP ceiling (RATE_LIMITED)
  /auth/token/refresh:
    post:
      operationId: authTokenRefresh
      tags: [Auth]
      summary: "Exchange a refresh token for a new access + refresh token pair (rotated)."
      security: []
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/TokenRefreshBody' } } } }
      responses:
        '200': { description: "New session tokens.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SessionTokens' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      operationId: authLogout
      tags: [Auth]
      summary: "Revoke the current refresh token and its session."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/LogoutBody' } } } }
      responses:
        '204': { description: "Session revoked.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      operationId: meGet
      tags: [Me]
      summary: "Own profile."
      responses:
        '200': { description: "Profile.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }  # A-3-03: global per-IP ceiling (RATE_LIMITED)
    patch:
      operationId: meUpdate
      tags: [Me]
      summary: "Update language, preferred currency, name, or email."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdateBody' } } } }
      responses:
        '200': { description: "Updated profile.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: meDeleteAccount
      tags: [Me]
      summary: "Request account deletion, subject to retention policy."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DeleteAccountBody' } } } }
      responses:
        '202': { description: "Deletion accepted.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /legal/current:
    get:
      operationId: legalCurrent
      tags: [Legal]
      summary: "Current legal documents for the caller's app and language."
      responses:
        '200': { description: "Legal documents.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LegalDocument' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /legal/{versionId}/accept:
    post:
      operationId: legalAccept
      tags: [Legal]
      summary: "Record acceptance of a legal document version."
      parameters: [ { $ref: '#/components/parameters/VersionId' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/LegalAcceptBody' } } } }
      responses:
        '204': { description: "Accepted.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /push/devices:
    post:
      operationId: pushDeviceRegister
      tags: [Push]
      summary: "Register (or re-register) a push notification device token."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PushDeviceRegisterBody' } } } }
      responses:
        '201': { description: "Registered.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /push/devices/{id}:
    delete:
      operationId: pushDeviceUnregister
      tags: [Push]
      summary: "Unregister a push device token."
      parameters: [ { $ref: '#/components/parameters/PushDeviceId' } ]
      responses:
        '204': { description: "Unregistered.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /uploads/authorize:
    post:
      operationId: uploadsAuthorize
      tags: [Uploads]
      summary: "Authorize a direct-to-storage upload; returns a presigned PUT URL."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UploadAuthorizeBody' } } } }
      responses:
        '201': { description: "Upload grant issued.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/UploadAuthorizeResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /uploads/{id}/complete:
    post:
      operationId: uploadsComplete
      tags: [Uploads]
      summary: "Confirm the object was uploaded; server validates size/type and scans it."
      parameters: [ { $ref: '#/components/parameters/UploadId' } ]
      responses:
        '200': { description: "Upload status.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/UploadCompleteResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /config/bootstrap:
    get:
      operationId: configBootstrap
      tags: [Config]
      summary: "App bootstrap: published currencies, visible categories, SOS config, contact window, support info."
      responses:
        '200': { description: "Bootstrap configuration.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BootstrapConfig' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rider/service-areas/check:
    get:
      operationId: riderServiceAreaCheck
      tags: [Rider Coverage]
      summary: "Check whether a point is inside a published, active service zone."
      parameters: [ { name: lat, in: query, required: true, schema: { type: number } }, { name: lng, in: query, required: true, schema: { type: number } } ]
      responses:
        '200': { description: "Coverage result.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceAreaCheckResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rider/nearby-vehicles:
    get:
      operationId: riderNearbyVehicles
      tags: [Rider Coverage]
      summary: "Coarse, snapped/delayed vehicle positions near a point, for the home map."
      parameters: [ { name: lat, in: query, required: true, schema: { type: number } }, { name: lng, in: query, required: true, schema: { type: number } } ]
      responses:
        '200': { description: "Nearby vehicles.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NearbyVehicle' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rider/places:
    get:
      operationId: riderPlacesList
      tags: [Rider Places]
      summary: "List saved places."
      responses:
        '200': { description: "Saved places.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SavedPlace' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: riderPlacesCreate
      tags: [Rider Places]
      summary: "Add a saved place."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SavedPlaceCreateBody' } } } }
      responses:
        '201': { description: "Created.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SavedPlace' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rider/places/{id}:
    patch:
      operationId: riderPlacesUpdate
      tags: [Rider Places]
      summary: "Edit a saved place."
      parameters: [ { $ref: '#/components/parameters/PlaceId' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SavedPlaceUpdateBody' } } } }
      responses:
        '200': { description: "Updated.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SavedPlace' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: riderPlacesDelete
      tags: [Rider Places]
      summary: "Remove a saved place."
      parameters: [ { $ref: '#/components/parameters/PlaceId' } ]
      responses:
        '204': { description: "Deleted.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rider/quotes:
    post:
      operationId: riderQuotesCreate
      tags: [Rider Quotes]
      summary: "Get a fare quote per available category, in every published currency."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/QuoteRequestBody' } } } }
      responses:
        '200': { description: "Category quotes.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /rider/promo/validate:
    post:
      operationId: riderPromoValidate
      tags: [Rider Quotes]
      summary: "Validate a promo code against a quote/category before requesting."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PromoValidateBody' } } } }
      responses:
        '200': { description: "Validation result.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PromoValidateResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /rider/rides:
    post:
      operationId: riderRidesCreate
      tags: [Rider Rides]
      summary: "Request a ride from a quote. Dispatch then offers it to drivers one at a time."
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RideCreateBody' } } } }
      responses:
        '201': { description: "Ride created (SEARCHING). A retried request with the same Idempotency-Key returns the same ride.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Ride' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      operationId: riderRidesHistory
      tags: [Rider Rides]
      summary: "Ride history, paginated, newest first."
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: "Ride history.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RideListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/active-ride:
    get:
      operationId: riderActiveRide
      tags: [Rider Rides]
      summary: "Recovery snapshot of the rider's active ride, if any. Call on app start/resume/reconnect."
      responses:
        '200': { description: "Active ride, or null if none. Includes server_now and version.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Ride' }, nullable: true } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rider/rides/{id}:
    get:
      operationId: riderRideGet
      tags: [Rider Rides]
      summary: "Full ride snapshot (role-filtered)."
      parameters: [ { $ref: '#/components/parameters/RideId' } ]
      responses:
        '200': { description: "Ride.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Ride' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rider/rides/{id}/cancel:
    post:
      operationId: riderRideCancel
      tags: [Rider Rides]
      summary: "Cancel a ride in SEARCHING, CONFIRMED, or AT_PICKUP."
      parameters: [ { $ref: '#/components/parameters/RideId' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CancelRideBody' } } } }
      responses:
        '200': { description: "Cancelled.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CancelRideResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /rider/rides/{id}/payment-dispute:
    post:
      operationId: riderPaymentDispute
      tags: [Rider Rides]
      summary: "Open a fare dispute on the recorded payment (\"I have a problem with this\")."
      parameters: [ { $ref: '#/components/parameters/RideId' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PaymentDisputeBody' } } } }
      responses:
        '201': { description: "Dispute opened; payment moves to DISPUTED.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SupportCase' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /rider/rides/{id}/chat:
    get:
      operationId: riderChatList
      tags: [Rider Chat]
      summary: "Chat history for a ride, with translations."
      parameters: [ { $ref: '#/components/parameters/RideId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: "Messages.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ChatListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: riderChatSend
      tags: [Rider Chat]
      summary: "Send a chat message. Open from confirmation until the contact window closes."
      parameters: [ { $ref: '#/components/parameters/RideId' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ChatSendBody' } } } }
      responses:
        '201': { description: "Sent (a retry with the same client_message_id never duplicates).", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /rider/rides/{id}/chat/seen:
    post:
      operationId: riderChatSeen
      tags: [Rider Chat]
      summary: "Mark chat messages as seen up to a given message."
      parameters: [ { $ref: '#/components/parameters/RideId' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ChatSeenBody' } } } }
      responses:
        '204': { description: "Marked seen.", headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rider/rides/{id}/call-eligibility:
    get:
      operationId: riderCallEligibility
      tags: [Rider Rides]
      summary: "Whether calling the driver is currently allowed; returns the number only inside the window."
      parameters: [ { $ref: '#/components/parameters/RideId' } ]
      responses:

        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    riderDriverBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Rider or driver app session token. The `app` claim (RIDER|DRIVER) tags which app issued the
        token; endpoints under a given app's tags reject a token from the other app with
        NOT_AUTHORIZED.
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Admin console session token, issued only after password + TOTP MFA verification
        (POST /admin/auth/mfa/verify). Carries admin_id and role codes.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated unique key for this operation. Same key + same request body returns the
        stored response. Same key + different body returns 409 IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      description: "Opaque pagination cursor from a previous page's `next_cursor`."
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ReasonQuery:
      name: reason
      in: query
      required: true
      description: "Free-text justification, recorded to the audit log with this request."
      schema:
        type: string
        minLength: 3
        maxLength: 500
    RideId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryPathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      name: id
      in: path
      required: true
      description: "Account id (rider or driver)."
      schema:
        type: string
        format: uuid
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CheckId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ZoneId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DiscountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TariffId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminUserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayoutId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PushDeviceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    X-Correlation-Id:
      description: "Server-assigned correlation id for this request/response, also present in the error body."
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: "Request failed validation (VALIDATION_FAILED, UPLOAD_INVALID, PROMO_INVALID, ...)."
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: "Missing, expired, or invalid bearer token (NOT_AUTHENTICATED)."
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >-
        Authenticated but not allowed (NOT_AUTHORIZED, ACCOUNT_BLOCKED, TERMS_ACCEPTANCE_REQUIRED,
        OFFER_NOT_FOR_DRIVER, CATEGORY_NOT_ELIGIBLE).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: "No resource with that id, or it is not visible to the caller."
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: >-
        State conflict (VERSION_CONFLICT, ACTIVE_RIDE_EXISTS, RIDE_ALREADY_ASSIGNED,
        OFFER_ALREADY_RESOLVED, OFFER_NOT_ACKNOWLEDGED, DRIVER_NOT_ELIGIBLE, INVALID_TRIP_TRANSITION,
        IDEMPOTENCY_KEY_REUSED, QUOTE_ALREADY_USED, PAYMENT_ALREADY_RECORDED).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: "The resource expired or is no longer actionable (OFFER_EXPIRED, QUOTE_STALE, PROMO_EXPIRED)."
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: >-
        Well-formed but not actionable given business rules (OUTSIDE_SERVICE_AREA,
        CATEGORY_UNAVAILABLE, PROMO_LIMIT_REACHED, CONTACT_WINDOW_CLOSED, PAYMENT_METHOD_DISABLED).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: "Too many requests (OTP_RATE_LIMITED, RATE_LIMITED)."
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
        Retry-After:
          description: "Seconds until the client may retry."
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: "An upstream provider (routing, translation, storage) failed temporarily (PROVIDER_TEMPORARY_FAILURE)."
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - NOT_AUTHENTICATED
        - NOT_AUTHORIZED
        - ACCOUNT_BLOCKED
        - TERMS_ACCEPTANCE_REQUIRED
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_RATE_LIMITED
        - OUTSIDE_SERVICE_AREA
        - CATEGORY_UNAVAILABLE
        - CATEGORY_NOT_ELIGIBLE
        - QUOTE_STALE
        - QUOTE_ALREADY_USED
        - ACTIVE_RIDE_EXISTS
        - PROMO_INVALID
        - PROMO_EXPIRED
        - PROMO_LIMIT_REACHED
        - DRIVER_NOT_ELIGIBLE
        - OFFER_NOT_FOR_DRIVER
        - OFFER_NOT_ACKNOWLEDGED
        - OFFER_EXPIRED
        - OFFER_ALREADY_RESOLVED
        - RIDE_ALREADY_ASSIGNED
        - INVALID_TRIP_TRANSITION
        - VERSION_CONFLICT
        - PAYMENT_METHOD_DISABLED
        - PAYMENT_ALREADY_RECORDED
        - CONTACT_WINDOW_CLOSED
        - UPLOAD_INVALID
        - IDEMPOTENCY_KEY_REUSED
        - PROVIDER_TEMPORARY_FAILURE
        - RATE_LIMITED
        - NOT_FOUND          # Phase 3 amendment A-3-02: unknown route/resource (404)
        - INTERNAL_ERROR     # Phase 3 amendment A-3-02: unhandled failure (500), no internals exposed
    Error:
      type: object
      required: [code, message, correlation_id]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          description: "Localized, user-safe message in the caller's app language."
          type: string
        correlation_id:
          type: string
          format: uuid
        details:
          description: "Optional machine-readable context (e.g. field errors). Never PII beyond what the caller already sent."
          type: object
          additionalProperties: true
    CurrencyCode:
      type: string
      enum: [USD, LBP]
    Money:
      type: object
      required: [currency, amount_minor]
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        amount_minor:
          description: "Integer minor units (cents for USD, whole LBP since LBP has 0 minor exponent)."
          type: integer
    LocalizedText:
      type: object
      description: "Present languages only; a language missing means no translation exists yet."
      properties:
        ar: { type: string }
        en: { type: string }
        fr: { type: string }
    AppKind:
      type: string
      enum: [RIDER, DRIVER]
    Gender:
      type: string
      enum: [FEMALE, MALE]
    GeoPoint: { type: object, required: [lat, lng], properties: { lat: { type: number, format: double, minimum: -90, maximum: 90 }, lng: { type: number, format: double, minimum: -180, maximum: 180 } } }
    PlaceInput: { type: object, required: [lat, lng], properties: { lat: { type: number, format: double }, lng: { type: number, format: double }, address_text: { type: string } } }
    FareAddonLine: { type: object, properties: { code: { type: string }, name: { $ref: '#/components/schemas/LocalizedText' }, amount_minor: { type: integer } } }
    FareBreakdown:
      type: object
      description: "One currency's fare components. Matches `quote_amounts.breakdown` / `ride_fares` in schema.sql."
      required:
        - currency
        - base_minor
        - distance_minor
        - time_minor
        - surge_multiplier_bp
        - addons
        - minimum_adjustment_minor
        - discount_minor
        - rounding_minor
        - total_minor
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        base_minor: { type: integer }
        distance_minor: { type: integer }
        time_minor: { type: integer }
        surge_multiplier_bp:
          description: "10000 = ×1.0."
          type: integer
        addons:
          type: array
          items: { $ref: '#/components/schemas/FareAddonLine' }
        minimum_adjustment_minor:
          description: "Amount added by the minimum-fare floor, if any (0 otherwise)."
          type: integer
        discount_minor: { type: integer }
        rounding_minor:
          description: "Amount added or removed by rounding to the tariff's increment."
          type: integer
        total_minor: { type: integer }
    Fare:
      type: object
      description: "A fare in every published currency that has a tariff for this category/zone."
      required: [quoted]
      properties:
        quoted:
          type: array
          items: { $ref: '#/components/schemas/FareBreakdown' }
        final:
          description: "Set only once a ride reaches COMPLETED. Equal to quoted in FIXED fare mode."
          type: array
          items: { $ref: '#/components/schemas/FareBreakdown' }
        fare_mode:
          type: string
          enum: [FIXED, RECALCULATE]
        recalc_cap_bp:
          description: "Final fare cap relative to quoted, e.g. 2000 = up to +20%. Null in FIXED mode."
          type: integer
          nullable: true
    UploadPurpose:
      type: string
      enum: [DRIVER_DOCUMENT, PROFILE_PHOTO, VEHICLE_CHECK, CASE_EVIDENCE]
    ChatMessage:
      type: object
      required: [id, ride_id, sender_role, client_message_id, body, created_at]
      properties:
        id: { type: string, format: uuid }
        ride_id: { type: string, format: uuid }
        sender_role: { type: string, enum: [RIDER, DRIVER] }
        client_message_id: { type: string }
        body: { type: string }
        source_language: { type: string, nullable: true }
        translation:
          type: object
          nullable: true
          properties:
            language: { type: string }
            text: { type: string }
            status: { type: string, enum: [PENDING, DONE, FAILED] }
        seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ChatSendBody:
      type: object
      required: [client_message_id, body]
      properties:
        client_message_id:
          description: "Idempotency for chat sends; a retry with the same id never duplicates."
          type: string
        body:
          type: string
          minLength: 1
          maxLength: 2000
    ReviewCreateBody:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000 }
        tags:
          type: array
          items: { type: string }
        declared_tip: { $ref: '#/components/schemas/Money' }
    SupportCaseType:
      type: string
      enum: [LOST_ITEM, MESS_DAMAGE, FARE_PAYMENT, DRIVER_BEHAVIOUR, RIDER_BEHAVIOUR, SAFETY, ELIGIBILITY_MISMATCH, APP, OTHER]
    SupportCaseStatus:
      type: string
      enum: [OPEN, IN_REVIEW, WAITING_USER, RESOLVED, CLOSED]
    SupportCase:
      type: object
      required: [id, case_type, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        case_type: { $ref: '#/components/schemas/SupportCaseType' }
        ride_id: { type: string, format: uuid, nullable: true }
        subject: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/SupportCaseStatus' }
        resolution: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SupportCaseCreateBody:
      type: object
      required: [case_type]
      properties:
        case_type: { $ref: '#/components/schemas/SupportCaseType' }
        ride_id: { type: string, format: uuid }
        subject: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        evidence_upload_ids:
          type: array
          items: { type: string, format: uuid }
    CaseMessage:
      type: object
      required: [id, case_id, body, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        author: { type: string, enum: [ACCOUNT, ADMIN] }
        client_message_id: { type: string, nullable: true }
        body: { type: string }
        internal_note: { type: boolean }
        created_at: { type: string, format: date-time }
    CaseMessageCreateBody: { type: object, required: [body], properties: { client_message_id: { type: string }, body: { type: string, minLength: 1, maxLength: 2000 } } }
    SOSStatus:
      type: string
      enum: [RECEIVED, AGENT_JOINED, AGENT_CALLING, RESOLVED]
    DeliveryStatus:
      type: string
      enum: [QUEUED, SENT, FAILED, NOT_APPLICABLE]
    SOSIncident:
      type: object
      required: [id, status, no_agent_fallback, created_at]
      properties:
        id: { type: string, format: uuid }
        ride_id: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/SOSStatus' }
        no_agent_fallback:
          description: "True if no agent was on shift at creation."
          type: boolean
        fallback_number:
          description: "CMS emergency number, present only when no_agent_fallback is true."
          type: string
          nullable: true
        oncall_alert_status: { $ref: '#/components/schemas/DeliveryStatus' }
        assigned_agent_name: { type: string, nullable: true }
        resolution: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        server_now: { type: string, format: date-time }
    SOSIncidentCreateBody:
      type: object
      required: [client_request_id, location]
      properties:
        client_request_id:
          description: "Idempotency for SOS creation; a retry with the same id returns the same incident."
          type: string
        ride_id: { type: string, format: uuid }
        location: { $ref: '#/components/schemas/GeoPoint' }
    SOSMessage: { type: object, required: [id, incident_id, body, created_at], properties: { id: { type: string, format: uuid }, incident_id: { type: string, format: uuid }, author: { type: string, enum: [ACCOUNT, ADMIN] }, body: { type: string }, created_at: { type: string, format: date-time } } }
    BootstrapConfig:
      type: object
      required: [published_currencies, categories, sos, contact_window_after_trip_s, support, server_now]
      properties:
        published_currencies:
          type: array
          items: { $ref: '#/components/schemas/CurrencyCode' }
        categories:
          description: "Categories visible to this account (zone/eligibility already filtered where a location is known)."
          type: array
          items: { $ref: '#/components/schemas/CategorySummary' }
        sos:
          type: object
          properties:
            actions:
              type: array
              items: { type: string }
            fallback_number: { type: string, nullable: true }
        contact_window_after_trip_s:
          description: "CONTACT_WINDOW_AFTER_TRIP_S platform setting."
          type: integer
        support:
          type: object
          properties:
            help_center_url: { type: string, nullable: true }
        server_now: { type: string, format: date-time }
    CategorySummary:
      type: object
      required: [id, code, names, icon]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        names: { $ref: '#/components/schemas/LocalizedText' }
        icon: { type: string }
        base_type: { type: string, enum: [CAR, MOTORCYCLE, TUKTUK] }
        female_only_driver: { type: boolean }
        female_only_rider: { type: boolean }
    OtpRequestBody: { type: object, required: [phone_e164, app], properties: { phone_e164: { type: string, pattern: '^\+[1-9][0-9]{6,14}$' }, app: { $ref: '#/components/schemas/AppKind' } } }
    OtpRequestResponse: { type: object, required: [challenge_id, expires_at, resend_after], properties: { challenge_id: { type: string, format: uuid }, expires_at: { type: string, format: date-time }, resend_after: { type: string, format: date-time } } }
    OtpVerifyBody: { type: object, required: [challenge_id, code], properties: { challenge_id: { type: string, format: uuid }, code: { type: string, minLength: 4, maxLength: 8 } } }
    SessionTokens: { type: object, required: [access_token, refresh_token, expires_at], properties: { access_token: { type: string }, refresh_token: { type: string }, expires_at: { type: string, format: date-time } } }
    OtpVerifyResponse:
      type: object
      required: [status]
      properties:
        status:
          description: "SESSION for a returning, profiled account; NEEDS_PROFILE for a new phone number."
          type: string
          enum: [SESSION, NEEDS_PROFILE]
        session: { $ref: '#/components/schemas/SessionTokens' }
        needs_profile_token:
          description: "Short-lived token; send as bearer on POST /me/complete-profile."
          type: string
        account_id: { type: string, format: uuid }
    TokenRefreshBody: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } }
    LogoutBody: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } }
    Profile:
      type: object
      required: [id, phone_e164, language, status]
      properties:
        id: { type: string, format: uuid }
        phone_e164: { type: string }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        gender: { $ref: '#/components/schemas/Gender' }
        gender_confirmed: { type: boolean }
        email: { type: string, nullable: true }
        language: { type: string, enum: [ar, en, fr] }
        preferred_currency: { $ref: '#/components/schemas/CurrencyCode' }
        status: { type: string, enum: [ACTIVE, DELETED] }
    CompleteProfileBody:
      type: object
      required: [first_name, last_name, gender, accepted_legal_version_ids]
      properties:
        first_name: { type: string, minLength: 1 }
        last_name: { type: string, minLength: 1 }
        gender: { $ref: '#/components/schemas/Gender' }
        email: { type: string, format: email }
        language: { type: string, enum: [ar, en, fr] }
        accepted_legal_version_ids:
          type: array
          items: { type: string, format: uuid }
    ProfileUpdateBody: { type: object, properties: { first_name: { type: string }, last_name: { type: string }, email: { type: string, format: email }, language: { type: string, enum: [ar, en, fr] }, preferred_currency: { $ref: '#/components/schemas/CurrencyCode' } } }
    DeleteAccountBody: { type: object, properties: { reason: { type: string, maxLength: 500 } } }
    LegalDocument:
      type: object
      required: [id, doc_type, version_no, requires_reacceptance, language, title, body_markdown]
      properties:
        id: { type: string, format: uuid }
        doc_type: { type: string, enum: [TERMS, PRIVACY, DRIVER_AGREEMENT, CANCELLATION, OTHER] }
        version_no: { type: integer }
        requires_reacceptance: { type: boolean }
        language: { type: string, enum: [ar, en, fr] }
        title: { type: string }
        body_markdown: { type: string }
        change_summary: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
    LegalAcceptBody:
      type: object
      properties: {}
    PushDeviceRegisterBody: { type: object, required: [platform, token], properties: { platform: { type: string, enum: [android, ios] }, token: { type: string } } }
    UploadAuthorizeBody: { type: object, required: [purpose, content_type, max_bytes], properties: { purpose: { $ref: '#/components/schemas/UploadPurpose' }, content_type: { type: string }, max_bytes: { type: integer, maximum: 26214400 } } }
    UploadAuthorizeResponse:
      type: object
      required: [upload_id, put_url, expires_at]
      properties:
        upload_id: { type: string, format: uuid }
        put_url:
          description: "Presigned PUT URL to the private object store; upload directly, then call complete."
          type: string
        required_headers:
          type: object
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }
    UploadCompleteResponse: { type: object, required: [upload_id, status], properties: { upload_id: { type: string, format: uuid }, status: { type: string, enum: [AUTHORIZED, COMPLETED, QUARANTINED, REJECTED, EXPIRED] }, size_bytes: { type: integer, nullable: true }, sha256: { type: string, nullable: true } } }
    ServiceAreaCheckResponse:
      type: object
      required: [inside]
      properties:
        inside: { type: boolean }
        zone_id: { type: string, format: uuid, nullable: true }
        active_zone_names:
          description: "Names of currently active zones, for the \"not available here yet\" message."
          type: array
          items: { $ref: '#/components/schemas/LocalizedText' }
    NearbyVehicle:
      type: object
      required: [category_id, location]
      properties:
        category_id: { type: string, format: uuid }
        location: { $ref: '#/components/schemas/GeoPoint' }
        heading:
          description: "Degrees, 0-359. Coarse: snapped and delayed per privacy rules."
          type: number
          nullable: true
    SavedPlace: { type: object, required: [id, label, location], properties: { id: { type: string, format: uuid }, label: { type: string }, icon: { type: string, nullable: true }, address_text: { type: string, nullable: true }, location: { $ref: '#/components/schemas/GeoPoint' } } }
    SavedPlaceCreateBody: { type: object, required: [label, location], properties: { label: { type: string, minLength: 1, maxLength: 60 }, icon: { type: string }, address_text: { type: string }, location: { $ref: '#/components/schemas/GeoPoint' } } }
    SavedPlaceUpdateBody: { type: object, properties: { label: { type: string, minLength: 1, maxLength: 60 }, icon: { type: string }, address_text: { type: string }, location: { $ref: '#/components/schemas/GeoPoint' } } }
    QuoteRequestBody: { type: object, required: [pickup, dropoff], properties: { pickup: { $ref: '#/components/schemas/PlaceInput' }, dropoff: { $ref: '#/components/schemas/PlaceInput' }, promo_code: { type: string } } }
    CategoryQuote:
      type: object
      required: [quote_id, category_id, names, icon, available, fares, surge_multiplier_bp, expires_at]
      properties:
        quote_id:
          description: "Pass this to POST /rider/rides to request this category."
          type: string
          format: uuid
        category_id: { type: string, format: uuid }
        names: { $ref: '#/components/schemas/LocalizedText' }
        icon: { type: string }
        female_only_rider: { type: boolean }
        available:
          description: "False when no nearby driver, no tariff, or zone-disabled; see unavailable_reason."
          type: boolean
        unavailable_reason:
          type: string
          enum: [NO_DRIVERS_NEARBY, CATEGORY_UNAVAILABLE, CATEGORY_NOT_ELIGIBLE]
          nullable: true
        eta_minutes:
          description: "Road ETA for the nearest candidate. Null if unavailable — never a guess."
          type: integer
          nullable: true
        fares:
          type: array
          items: { $ref: '#/components/schemas/FareBreakdown' }
        surge_multiplier_bp: { type: integer }
        fare_mode: { type: string, enum: [FIXED, RECALCULATE] }
        recalc_cap_bp: { type: integer, nullable: true }
        discount_applied:
          type: object
          nullable: true
          properties:
            code: { type: string, nullable: true }
            summary: { type: string }
        expires_at: { type: string, format: date-time }
    QuoteResponse:
      type: object
      required: [pickup, dropoff, distance_m, duration_s, categories, server_now]
      properties:
        pickup: { $ref: '#/components/schemas/GeoPoint' }
        dropoff: { $ref: '#/components/schemas/GeoPoint' }
        distance_m: { type: integer }
        duration_s: { type: integer }
        categories:
          type: array
          items: { $ref: '#/components/schemas/CategoryQuote' }
        server_now: { type: string, format: date-time }
    PromoValidateBody: { type: object, required: [code], properties: { code: { type: string }, category_id: { type: string, format: uuid }, quote_id: { type: string, format: uuid } } }
    PromoValidateResponse: { type: object, required: [valid], properties: { valid: { type: boolean }, summary: { type: string, nullable: true }, reason: { $ref: '#/components/schemas/ErrorCode' } } }
    RideCreateBody: { type: object, required: [quote_id], properties: { quote_id: { type: string, format: uuid } } }
    RideStatus:
